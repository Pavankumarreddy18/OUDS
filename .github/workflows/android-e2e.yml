name: Mobile Appium E2E (1,111 Android Tests)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'OUDSAppium/package.json'

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install Appium Dependencies
      run: |
        cd OUDSAppium
        npm install
        npm i -g appium
        appium driver install uiautomator2

    - name: Install Frontend Dependencies and Sync Capacitor
      run: |
        cd client
        npm install
        npm run build
        npx cap sync

    - name: Build Android Debug APK
      run: |
        cd client/android
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Run Appium Tests on Android Emulator
      uses: reactivecircus/android-emulator-runner@v2
      env:
        APK_PATH: ${{ github.workspace }}/client/android/app/build/outputs/apk/debug/app-debug.apk
      with:
        api-level: 29
        profile: Nexus 6
        target: default
        arch: x86
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: |
          cd OUDSAppium
          chmod +x scripts/ci_run_tests.sh
          ./scripts/ci_run_tests.sh

    - name: Ensure Test Result Directories Exist
      if: always()
      run: |
        mkdir -p OUDSAppium/Test_Results/HTML
        mkdir -p OUDSAppium/Test_Results/Excel

    - name: Upload Test Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-appium-reports
        path: |
          OUDSAppium/Test_Results/HTML/
          OUDSAppium/Test_Results/Excel/

    - name: Deploy Latest to GitHub Pages
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: OUDSAppium/Test_Results/HTML
        target-folder: reports/latest
        clean: false

    - name: Deploy Historical Build to GitHub Pages
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: OUDSAppium/Test_Results/HTML
        target-folder: reports/history/build-${{ github.run_number }}
        clean: false
