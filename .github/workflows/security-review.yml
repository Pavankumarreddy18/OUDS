name: Backend Security Review

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js for Scripts
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Security Suite Dependencies
        working-directory: ./OUDSBackend
        run: npm install

      - name: Run Backend Security Scan
        working-directory: ./OUDSBackend
        run: node scripts/generateSecuritySuite.js

      - name: Enforce Zero-Critical Security Gate
        run: |
          CRITICAL_COUNT=$(grep -o "Critical: [0-9]*" OUDSBackend/Test_Results/Security/executive-summary.md | awk '{print $2}')
          echo "Found $CRITICAL_COUNT critical vulnerabilities in Backend."
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "Security Gate Failed: Critical vulnerabilities found!"
            exit 1
          fi

      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-security-findings
          path: OUDSBackend/Test_Results/Security/
